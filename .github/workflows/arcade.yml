name: Arcade (games, high scores, achievements, weapons)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/scoreboard.mjs
      - .github/workflows/arcade.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pac-Man, Galaga, Tetris and Breakout
        uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,galaga,tetris,breakout,puzzle-bobble,bomberman,minesweeper"

      - name: Node for the score boards
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # Personal token counts private contributions; repo token if it's missing or expired.
      - id: scores
        continue-on-error: true
        run: node .github/scripts/scoreboard.mjs ${{ github.repository_owner }} dist/scoreboard.svg dist/achievements.svg dist/weapons.svg
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - if: steps.scores.outcome != 'success'
        run: node .github/scripts/scoreboard.mjs ${{ github.repository_owner }} dist/scoreboard.svg dist/achievements.svg dist/weapons.svg
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
